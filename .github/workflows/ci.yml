name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      # mongodb-memory-server downloads a real mongod binary on first run; this
      # caches it across runs so the test job stays fast.
      - name: Cache mongod binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mongodb-binaries
            node_modules/.cache/mongodb-memory-server
          key: mongodb-memory-server-${{ runner.os }}

      - name: Run backend tests
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build