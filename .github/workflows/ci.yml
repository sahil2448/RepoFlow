name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      # mongodb-memory-server downloads a real mongod binary on first run; this
      # caches it across runs so the test job stays fast.
      - name: Cache mongod binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mongodb-binaries
            node_modules/.cache/mongodb-memory-server
          key: mongodb-memory-server-${{ runner.os }}

      - name: Run backend tests
        env:
          # Keep CI hermetic: these exist before Node starts, so Pinecone /
          # Gemini / AWS never see a missing config. Real credentials stay in
          # .env on the server and are never used in CI.
          PINECONE_API_KEY: ci-dummy-key
          PINECONE_INDEX: ci-dummy-index
          GOOGLE_API_KEY: ci-dummy-key
          AWS_ACCESS_KEY_ID: nope
          AWS_SECRET_ACCESS_KEY: nope
          AWS_REGION: us-east-1
        run: npm test

      # this provided by cline, but it fails on the linux runner because of a missing optional dependency in the lockfile
      # - name: Build frontend
      #   working-directory: frontend
      #   run: |
      #     npm install --no-audit --no-fund
      #     # Vite 8 bundles with rolldown, which needs a platform-native binding
      #     # shipped as an npm optional dependency. The lockfile was generated on
      #     # Windows (win32 binding), so the Linux runner can miss
      #     # @rolldown/binding-linux-x64-gnu (known npm optional-deps bug #4828).
      #     # Install it explicitly (--no-save: keeps package.json / lockfile
      #     # unchanged and only makes node_modules complete for this runner).
      #     npm install --no-save --no-audit --no-fund @rolldown/binding-linux-x64-gnu
      #     npm run build

      #  Provided by claude (Not cline one)
      - name: Build frontend
        working-directory: frontend
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install --no-audit --no-fund
          npm run build