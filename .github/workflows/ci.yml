name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      # mongodb-memory-server downloads a real mongod binary on first run; this
      # caches it across runs so the test job stays fast.
      - name: Cache mongod binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mongodb-binaries
            node_modules/.cache/mongodb-memory-server
          key: mongodb-memory-server-${{ runner.os }}

      - name: Run backend tests
        env:
          # Keep CI hermetic: these exist before Node starts, so Pinecone /
          # Gemini / AWS never see a missing config. Real credentials stay in
          # .env on the server and are never used in CI.
          PINECONE_API_KEY: ci-dummy-key
          PINECONE_INDEX: ci-dummy-index
          GOOGLE_API_KEY: ci-dummy-key
          AWS_ACCESS_KEY_ID: nope
          AWS_SECRET_ACCESS_KEY: nope
          AWS_REGION: us-east-1
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: |
          # npm install (not npm ci): the lockfile is generated on Windows and
          # Ubuntu CI can reject it via npm ci's strict platform-optional checks.
          # npm install reconciles the tree from package.json on any runner.
          npm install --no-audit --no-fund
          npm run build